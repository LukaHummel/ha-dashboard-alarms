name: Pylint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: Install dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Pylint
      run: python -m pylint custom_components/dashboard_alarms tools
    - name: Ruff
      run: python -m ruff check custom_components tests tools
    - name: Backend tests
      run: python -m pytest -q
    - name: Build and verify installation archive
      run: |
        python tools/build.py
        python tools/verify_archive.py

  browser-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
    - name: Install browser test dependencies
      run: npm ci
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
    - name: Card and global alarm dialog tests
      run: npm test
