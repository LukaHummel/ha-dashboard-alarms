name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: Install dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Check release metadata
      run: python tools/verify_release.py
    - name: Check tag matches the release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: python tools/verify_release.py --tag "$RELEASE_TAG"
    - name: Pylint
      run: python -m pylint custom_components/dashboard_alarms tools
    - name: Ruff
      run: python -m ruff check custom_components tests tools
    - name: Backend tests
      run: python -m pytest -q
    - name: Build and verify installation archive
      run: |
        python tools/build.py
        python tools/verify_archive.py
        git diff --exit-code -- custom_components/dashboard_alarms
    - name: Save verified installation archive
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: installation-archive
        path: outputs/dashboard-alarms-[0-9]*.zip
        if-no-files-found: error
        retention-days: 7

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
    - name: Install browser test dependencies
      run: npm ci
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
    - name: Card and global alarm dialog tests
      run: npm test

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Home Assistant integration validation
      uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: HACS integration validation
      uses: hacs/action@main
      env:
        # Validate this push/tag or the PR head, rather than an older release.
        REPOSITORY_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      with:
        category: integration
        comment: false
