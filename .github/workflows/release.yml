name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/pylint.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Require a commit merged into main
      run: git merge-base --is-ancestor HEAD origin/main
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Prepare release notes and version
      id: metadata
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: >-
        python tools/verify_release.py --tag "$RELEASE_TAG"
        --notes-output outputs/release-notes.md --github-output "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v4
      with:
        name: installation-archive
        path: outputs
    - name: Verify downloaded installation archive
      run: python tools/verify_archive.py
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        gh release create "$RELEASE_TAG" \
          "outputs/dashboard-alarms-${RELEASE_VERSION}.zip" \
          --verify-tag \
          --title "Dashboard Alarms ${RELEASE_VERSION}" \
          --notes-file outputs/release-notes.md
