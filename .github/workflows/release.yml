name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/pylint.yml

  release-please:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
    - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5.0.0
      id: release
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
    - name: Start validation for the release PR
      if: steps.release.outputs.prs_created == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_PRS: ${{ steps.release.outputs.prs }}
      # Explicit dispatch works with GITHUB_TOKEN, without approving bot PR runs.
      run: |
        printf '%s' "$RELEASE_PRS" | jq -r '.[] | [.headBranchName, .number] | @tsv' | while IFS=$'\t' read -r branch number; do
          gh workflow run pylint.yml --ref "$branch" -f pr-number="$number"
        done

  publish:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    uses: ./.github/workflows/publish-release.yml
    permissions:
      contents: write
      pull-requests: read
    with:
      tag: ${{ needs.release-please.outputs.tag }}
